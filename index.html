<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script type="module" src="src/script.js"></script>
		<link rel="stylesheet" href="style.css" />
		<title>Shared Bookmarks Project</title>
	</head>
	<body>
		<header>
			<div class="title-container">
				<h1>ShareMarks</h1>
				<p>Share your bookmarks</p>
			</div>
			<div class="user-select-container">
				<label for="user-select">Select a User</label>
				<select name="user-select" id="user-select">
					<option value="">Select a user...</option>
				</select>
			</div>
		</header>
		<main>
			<div class="content-layout">
				<div class="left-column">
					<p id="status-message" aria-live="polite"></p>
					<section id="bookmarks"></section>
				</div>

				<aside id="bookmark-form">
					<form action="" id="add-bookmark" hidden>
						<h2>Add a new bookmark</h2>
						<label for="title">Give a title to your bookmark</label>
						<input type="text" name="title" id="title" required />
						<label for="url">Add the link</label>
						<input type="url" name="url" id="url" required />
						<label for="description"
							>Write a short description</label
						>
						<textarea
							name="description"
							id="description"
							required
						></textarea>
						<button type="submit" id="submit-bookmark">
							Add Bookmark
						</button>
						<p id="form-error" aria-live="polite" hidden></p>
					</form>
				</aside>
			</div>
			<template id="bookmark-template">
				<article class="bookmark-card">
					<div class="bookmark-heading">
						<a bookmark-title class="bookmark-title" href=""
							>Title</a
						>
						<button copy-link class="copy-link">
							Copy Link
							<span tooltip class="tooltip">Copy Link</span>
						</button>
					</div>
					<span
						copy-feedback
						aria-live="polite"
						class="sr-only"
					></span>
					<p bookmark-description class="bookmark-description">
						Description
					</p>
					<div class="meta-info">
						<p created-at class="created-at"></p>
						<div class="likes-region">
							<p
								likes-counter
								class="likes-counter"
								aria-live="polite"
							>
								Likes
							</p>
							<button
								like-button
								class="like-button"
								aria-label="Add a like"
							>
								👍
							</button>
						</div>
					</div>
				</article>
			</template>
		</main>
	</body>
</html>
