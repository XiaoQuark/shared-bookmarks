<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script type="module" src="src/script.js"></script>
		<title>Shared Bookmarks Project</title>
	</head>
	<body>
		<header>
			<h1>ShareMarks</h1>
			<p>Share your bookmarks</p>
			<section id="user-select-container">
				<label for="user-select"
					>Select a User to see their bookmarks</label
				>
				<select name="user-select" id="user-select">
					<option value="">Select a user...</option>
				</select>
			</section>
		</header>
		<main>
			<p id="status-message" aria-live="polite">Please Select a User</p>

			<section id="bookmark-form"></section>
			<section id="bookmarks"></section>
		</main>
	</body>
</html>
